<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #eee; min-height: 100vh; padding: 1rem; }
  .app { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 1rem; color: #fff; }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .rate-row { display: flex; align-items: center; gap: 8px; }
  .rate-row label { font-size: 13px; color: #aaa; }
  .rate-row input { width: 80px; background: #222; border: 1px solid #333; border-radius: 8px; padding: 5px 8px; color: #fff; font-size: 13px; text-align: center; }
  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .nav-btn { background: #222; border: 1px solid #333; border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 18px; color: #eee; }
  .nav-btn:hover { background: #333; }
  .month-label { font-size: 17px; font-weight: 600; flex: 1; text-align: center; color: #fff; }
  .calendar { border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; margin-bottom: 1rem; }
  .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
  .day-header { font-size: 11px; font-weight: 600; color: #666; text-align: center; padding: 7px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .day-cell { min-height: 62px; border: 0.5px solid #1e1e1e; padding: 4px 5px; cursor: pointer; background: #161616; transition: background 0.12s; }
  .day-cell:hover { background: #1f1f1f; }
  .day-cell.empty { background: #111; cursor: default; }
  .day-cell.today { background: #0d2233; }
  .day-cell.today:hover { background: #122d45; }
  .day-cell.has-shift { background: #0d2215; }
  .day-cell.has-shift:hover { background: #122b1c; }
  .day-num { font-size: 12px; color: #555; font-weight: 500; }
  .day-cell.today .day-num { color: #4ea3e0; }
  .shift-time { font-size: 11px; font-weight: 600; color: #e07050; margin-top: 2px; }
  .shift-earn { font-size: 10px; color: #4caf82; }
  .summary { background: #161616; border-radius: 12px; border: 1px solid #2a2a2a; padding: 1rem; margin-bottom: 1rem; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: #1c1c1c; border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-size: 12px; color: #666; margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 600; color: #eee; }
  .stat-value.green { color: #4caf82; }
  .install-tip { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #666; text-align: center; line-height: 1.6; }
  .install-tip strong { color: #999; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  .modal-overlay.hidden { display: none; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 14px; padding: 1.25rem; width: 100%; max-width: 300px; }
  .modal h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 1rem; }
  .field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .field label { font-size: 13px; color: #aaa; }
  .field input { background: #111; border: 1px solid #333; border-radius: 8px; padding: 6px 10px; color: #fff; font-size: 14px; width: 130px; text-align: center; }
  .hours-preview { background: #111; border-radius: 8px; padding: 8px; font-size: 13px; color: #4caf82; text-align: center; margin-bottom: 1rem; font-weight: 500; }
  .modal-actions { display: flex; gap: 8px; }
  .btn-save { flex: 1; padding: 10px; background: #1D9E75; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-save:hover { background: #179068; }
  .btn-cancel { padding: 10px 14px; background: none; border: 1px solid #333; border-radius: 8px; font-size: 13px; cursor: pointer; color: #aaa; }
  .btn-cancel:hover { background: #222; }
  .btn-del { padding: 10px 14px; background: none; border: 1px solid #5a2020; border-radius: 8px; font-size: 13px; cursor: pointer; color: #c0504a; }
  .btn-del:hover { background: #2a1515; }
</style>
</head>
<body>
<div class="app">
  <div class="top-row">
    <h1>Shift Tracker</h1>
    <div class="rate-row">
      <label>€/hr</label>
      <input type="number" id="rate-input" value="12.1" step="0.1" min="0">
    </div>
  </div>

  <div class="month-nav">
    <button class="nav-btn" id="prev-btn">‹</button>
    <span class="month-label" id="month-label"></span>
    <button class="nav-btn" id="next-btn">›</button>
  </div>

  <div class="calendar">
    <div class="day-headers" id="day-headers"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="summary">
    <div class="summary-grid">
      <div class="stat">
        <div class="stat-label">Days worked</div>
        <div class="stat-value" id="stat-days">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Hours this month</div>
        <div class="stat-value" id="stat-hours">0:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Monthly income</div>
        <div class="stat-value green" id="stat-income">€0.00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Yearly estimate</div>
        <div class="stat-value green" id="stat-yearly">€0</div>
      </div>
    </div>
  </div>

  <div class="install-tip">
    <strong>Tip:</strong> In Chrome, tap the menu (⋮) → <strong>Add to Home Screen</strong> to use this like a real app.
  </div>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <h2 id="modal-title">Log shift</h2>
    <div class="field">
      <label>Start</label>
      <input type="time" id="start-time" value="10:30">
    </div>
    <div class="field">
      <label>Finish</label>
      <input type="time" id="end-time" value="21:00">
    </div>
    <div class="field">
      <label>Break (mins)</label>
      <input type="number" id="break-mins" value="0" min="0" max="480">
    </div>
    <div class="hours-preview" id="hours-preview">— hrs  •  €—</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-del" id="modal-delete" style="display:none;">Delete</button>
      <button class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let currentDate = new Date();
currentDate.setDate(1);
let shifts = {};
try { shifts = JSON.parse(localStorage.getItem('shifttracker_v1') || '{}'); } catch(e) {}
let selectedDay = null;
let hourlyRate = 12.1;

document.getElementById('rate-input').addEventListener('input', function() {
  hourlyRate = parseFloat(this.value) || 12.1;
  render();
});

function saveShifts() {
  try { localStorage.setItem('shifttracker_v1', JSON.stringify(shifts)); } catch(e) {}
}

function dateKey(y, m, d) {
  return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}

function timeToMins(t) {
  const parts = t.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function calcHours(start, end, brk) {
  let mins = timeToMins(end) - timeToMins(start) - (brk || 0);
  if (mins < 0) mins += 24 * 60;
  return Math.max(0, mins / 60);
}

function fmtHours(h) {
  const hrs = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  return hrs + ':' + String(mins).padStart(2,'0');
}

function render() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  document.getElementById('month-label').textContent = MONTHS[m] + ' ' + y;

  document.getElementById('day-headers').innerHTML = DAYS.map(d => '<div class="day-header">' + d + '</div>').join('');

  const firstDow = new Date(y, m, 1).getDay();
  const offset = firstDow === 0 ? 6 : firstDow - 1;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();

  let html = '';
  for (let i = 0; i < offset; i++) html += '<div class="day-cell empty"></div>';

  let totalHours = 0, totalDays = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(y, m, d);
    const shift = shifts[key];
    const isToday = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
    let cls = 'day-cell';
    if (isToday) cls += ' today';
    if (shift) { cls += ' has-shift'; totalDays++; }

    let inner = '<div class="day-num">' + d + '</div>';
    if (shift) {
      const h = calcHours(shift.start, shift.end, shift.brk);
      totalHours += h;
      inner += '<div class="shift-time">' + shift.start + '–' + shift.end + '</div>';
      inner += '<div class="shift-earn">€' + (h * hourlyRate).toFixed(2) + '</div>';
    }
    html += '<div class="' + cls + '" data-day="' + d + '">' + inner + '</div>';
  }

  document.getElementById('cal-grid').innerHTML = html;
  document.querySelectorAll('.day-cell[data-day]').forEach(function(el) {
    el.addEventListener('click', function() { openModal(parseInt(el.dataset.day)); });
  });

  const income = totalHours * hourlyRate;
  document.getElementById('stat-days').textContent = totalDays;
  document.getElementById('stat-hours').textContent = fmtHours(totalHours);
  document.getElementById('stat-income').textContent = '€' + income.toFixed(2);
  document.getElementById('stat-yearly').textContent = '€' + Math.round(income * 12).toLocaleString();
}

function updatePreview() {
  const s = document.getElementById('start-time').value;
  const e = document.getElementById('end-time').value;
  const b = parseInt(document.getElementById('break-mins').value) || 0;
  if (s && e) {
    const h = calcHours(s, e, b);
    document.getElementById('hours-preview').textContent = fmtHours(h) + ' hrs  •  €' + (h * hourlyRate).toFixed(2);
  }
}

function openModal(day) {
  selectedDay = day;
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  const key = dateKey(y, m, day);
  const shift = shifts[key];
  document.getElementById('modal-title').textContent = day + ' ' + MONTHS_SHORT[m] + ' ' + y;
  document.getElementById('start-time').value = shift ? shift.start : '10:30';
  document.getElementById('end-time').value = shift ? shift.end : '21:00';
  document.getElementById('break-mins').value = shift ? (shift.brk || 0) : 0;
  document.getElementById('modal-delete').style.display = shift ? 'inline-block' : 'none';
  updatePreview();
  document.getElementById('modal').classList.remove('hidden');
}

['start-time','end-time','break-mins'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', updatePreview);
});

document.getElementById('modal-cancel').addEventListener('click', function() {
  document.getElementById('modal').classList.add('hidden');
});

document.getElementById('modal-save').addEventListener('click', function() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  const key = dateKey(y, m, selectedDay);
  shifts[key] = {
    start: document.getElementById('start-time').value,
    end: document.getElementById('end-time').value,
    brk: parseInt(document.getElementById('break-mins').value) || 0
  };
  saveShifts();
  document.getElementById('modal').classList.add('hidden');
  render();
});

document.getElementById('modal-delete').addEventListener('click', function() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  const key = dateKey(y, m, selectedDay);
  delete shifts[key];
  saveShifts();
  document.getElementById('modal').classList.add('hidden');
  render();
});

document.getElementById('prev-btn').addEventListener('click', function() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  render();
});

document.getElementById('next-btn').addEventListener('click', function() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  render();
});

render();
</script>
</body>
</html>
